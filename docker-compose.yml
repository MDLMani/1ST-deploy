version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: tvk_support_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: tvk_support

  api:
    build: .
    container_name: tvk_support_api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/tvk_support
      JWT_ACCESS_SECRET: change-this-access-secret-min-16-chars
      JWT_REFRESH_SECRET: change-this-refresh-secret-min-16-chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: '*'
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 2000
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE: 5242880
      SWAGGER_SERVER_URL: http://localhost:5000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      - mongodb

volumes:
  mongodb_data:
  uploads_data:
  logs_data:
